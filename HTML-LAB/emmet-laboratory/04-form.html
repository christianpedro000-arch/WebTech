<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- PART 9 - Creating a Form -->
     <input type="text" name="text" id="text">
     <input type="email" name="email" id="email">
     <input type="password" name="password" id="password">
     <input type="checkbox" name="checkbox" id="checkbox">
     <input type="radio" name="radio" id="radio">
     <input type="submit" value="submit">

     <!-- Form Challenge -->
    <h1>Students Registration Form</h1>
    
    <table>
        <tr>
            <td><label for="student_id">STUDENTS ID: </label></td>
            <td><input type="number" name="student_id" id="student_id"></td>
        </tr>
        <tr>
            <td><label for="full_name">FULL NAME: </label></td>
            <td><input type="text" name="full_name" id="full_name"></td>
        </tr>
        <tr>
            <td><label for="email">EMAIL: </label></td>
            <td><input type="email" name="email" id="email"></td>
        </tr>

        <tr>
            <td><label for="password">PASSWORD: </label></td>
            <td><input type="password" name="password" id="password"></td>
        </tr>
        <tr>
            <td><label for="gender">GENDER: </label></td>
            <td>
                <input type="radio" name="gender" id="male">
                <label for="male">MALE</label>
                <input type="radio" name="gender" id="female">
                <label for="female">FEMALE</label>
            </td>
        </tr>
        <tr>
            <td><label for="course">COURSE: </label></td>
            <td><input type="text" name="course" id="course"></td>
        </tr>

        <tr>
            <td><label for="hobbies">Hobbies: </label></td>
            <td><input type="text" name="hobbies" id="hobbies"></td>
        </tr>
        <tr>
            <td><label for="address">Address: </label></td>
            <td><input type="text" name="address" id="address"></td>
        </tr>
        <tr>
            <td><input type="submit" value="Submit"></td>
        </tr>
    </table>
</body>
</html>
